name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app
        run: zip -r ven-entertainment-${{ github.ref_name }}.zip index.html README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ven_ Entertainment ${{ github.ref_name }}"
          generate_release_notes: true
          files: ven-entertainment-${{ github.ref_name }}.zip
