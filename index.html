<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ven_ Entertainment — Free & Legal Media Command Center</title>
<style>
  :root{
    --bg:#0a0c11;
    --side:#0e1118;
    --panel:#141824;
    --panel-2:#1a2030;
    --line:#232a3c;
    --text:#e9edf5;
    --muted:#98a2b8;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --star:#fbbf24;
    --pill:#212839;
    --shadow:0 12px 34px rgba(0,0,0,.4);
    --side-w:264px;
  }
  :root[data-theme="light"]{
    --bg:#f4f5f9;
    --side:#ffffff;
    --panel:#ffffff;
    --panel-2:#eef0f6;
    --line:#dfe3ee;
    --text:#161a24;
    --muted:#5b6478;
    --pill:#eef0f7;
    --shadow:0 12px 30px rgba(20,24,45,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  .app{display:flex;min-height:100vh}

  /* ============ SIDEBAR ============ */
  aside{
    width:var(--side-w);flex-shrink:0;background:var(--side);
    border-right:1px solid var(--line);padding:20px 14px;
    display:flex;flex-direction:column;gap:14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .logo{width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-weight:800;color:#0a0c11;font-size:17px}
  .brand b{font-size:15.5px;display:block;line-height:1.2}
  .brand small{color:var(--muted);font-size:11.5px}

  .search{position:relative}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px 12px 9px 34px;font-size:13.5px;outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search .mag{position:absolute;left:11px;top:9px;color:var(--muted);font-size:13px}
  .search kbd{
    position:absolute;right:9px;top:8px;color:var(--muted);font-size:10.5px;
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg);
  }

  nav{display:flex;flex-direction:column;gap:2px}
  nav .head{color:var(--muted);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;padding:10px 8px 4px}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--muted);
  }
  .nav-btn:hover{background:var(--panel);color:var(--text)}
  .nav-btn.active{background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(34,211,238,.08));color:var(--text);
    box-shadow:inset 0 0 0 1px rgba(124,92,255,.35)}
  .nav-btn .ic{width:20px;text-align:center}
  .nav-btn .n{margin-left:auto;background:var(--pill);border:1px solid var(--line);
    color:var(--muted);font-size:10.5px;padding:1px 7px;border-radius:99px}

  .side-foot{margin-top:auto;color:var(--muted);font-size:11px;padding:8px 6px;border-top:1px solid var(--line)}
  .side-foot b{color:#9ef0b6;font-weight:600}
  .side-label{color:var(--muted);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;padding:10px 8px 4px}
  .side-tools{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px}
  .side-tools .btn{padding:6px 10px;font-size:12px}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ MAIN ============ */
  main{flex:1;min-width:0;padding:26px 30px 60px}
  .main-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .main-head h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
  .main-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:640px}
  .surprise{
    background:linear-gradient(135deg,var(--accent),#5b3df0);color:#fff;border-radius:10px;
    padding:9px 16px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;
  }
  .surprise:hover{filter:brightness(1.12)}

  .grid{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .tile{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:9px;text-align:left;
    transition:transform .13s ease,border-color .13s ease;cursor:pointer;
  }
  .tile:hover{transform:translateY(-3px);border-color:#3a4763}
  .tile:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .tile .row1{display:flex;align-items:center;gap:10px}
  .mono{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
    font-weight:800;font-size:15px;color:#0a0c11;
  }
  .tile .nm{min-width:0}
  .tile .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .nm small{color:var(--muted);font-size:11px}
  .fav{margin-left:auto;font-size:15px;color:#4a5368;padding:4px}
  .fav.on{color:var(--star)}
  .fav:hover{transform:scale(1.2)}
  .tile .best{color:var(--muted);font-size:12.5px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
  .tile .pill{background:var(--pill);border:1px solid var(--line);color:var(--muted);font-size:10.5px;padding:2px 8px;border-radius:99px}
  .tile .go{margin-left:auto;color:var(--accent-2);font-size:11.5px;font-weight:600}

  .empty{color:var(--muted);padding:60px 0;text-align:center;font-size:14.5px}

  /* ============ PREVIEW OVERLAY ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(6px);
    display:none;z-index:50;
  }
  .overlay.open{display:flex}
  .pv{
    margin:auto;width:min(1180px,94vw);height:min(820px,92vh);
    background:var(--side);border:1px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
  }
  .pv-head{
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  .pv-head .mono{width:34px;height:34px;font-size:13px}
  .pv-head .t b{display:block;font-size:14.5px}
  .pv-head .t small{color:var(--muted);font-size:11.5px}
  .pv-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{
    border:1px solid var(--line);background:var(--panel-2);border-radius:9px;
    padding:7px 13px;font-size:12.5px;color:var(--text)
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#5b3df0);border:none;font-weight:600}
  .btn.x{padding:7px 11px}

  .pv-body{flex:1;display:flex;min-height:0}
  .pv-frame{flex:1;position:relative;background:#fff}
  .pv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pv-note{
    position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,17,.92);color:var(--muted);
    font-size:11.5px;padding:6px 14px;border-top:1px solid var(--line)
  }
  .pv-side{
    width:290px;flex-shrink:0;border-left:1px solid var(--line);padding:18px;
    display:flex;flex-direction:column;gap:14px;overflow-y:auto;background:var(--side);
  }
  .pv-side h4{margin:0;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .pv-side p{margin:4px 0 0;font-size:13px}
  .pv-side .pro-box{
    background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(34,211,238,.07));
    border:1px solid rgba(124,92,255,.3);border-radius:11px;padding:12px;
  }
  .pv-side .url{font-size:12px;color:var(--accent-2);word-break:break-all}

  @media (max-width:900px){
    .app{flex-direction:column}
    aside{position:static;width:100%;height:auto;flex-direction:column}
    .pv-side{display:none}
    main{padding:18px}
  }
</style>
</head>

<div class="app">

  <aside>
    <div class="brand">
      <div class="logo">V</div>

    </div>

      <!-- category buttons injected -->

      <button class="btn" id="importBtn" title="Import favorites from a JSON file">⬆ Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>

    <div class="side-foot">
      <b>100% free + legal</b> · <span id="foot-counts"></span><br/>
      Click any tile to preview it live.
    </div>
  </aside>

  <main>
    <div class="main-head">
      <div>
        <h1 id="cat-title"></h1>
        <p id="cat-blurb"></p>

        <button class="surprise" id="surprise">🎲 Surprise me</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No platforms match your search.</div>
  </main>
</div>

<!-- PREVIEW -->
<div class="overlay" id="overlay">
  <div class="pv">
    <div class="pv-head">
      <div class="mono" id="pv-mono"></div>
      <div class="t"><b id="pv-name"></b><small id="pv-tag"></small></div>
      <div class="pv-actions">
        <button class="btn" id="pv-fav">☆ Favorite</button>
        <button class="btn" id="pv-copy">🔗 Copy link</button>
        <a class="btn primary" id="pv-open" target="_blank" rel="noopener">Open in new tab ↗</a>
        <button class="btn x" id="pv-close" title="Close (Esc)">✕</button>
      </div>
    </div>
    <div class="pv-body">
      <div class="pv-frame">
        <iframe id="pv-frame" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <div class="pv-note">If the preview stays blank, this site blocks embedding — use <b>Open in new tab</b>.</div>
      </div>
      <div class="pv-side">
        <div><h4>Best for</h4><p id="pv-best"></p></div>
        <div class="pro-box"><h4>💎 Premium move</h4><p id="pv-pro"></p></div>
        <div><h4>Link</h4><p class="url" id="pv-url"></p></div>
      </div>
    </div>
  </div>
</div>

/* ---------- state ---------- */
let state = { cat:"movies", q:"", sort:"default" };
let favs = new Set(JSON.parse(localStorage.getItem("ven-favs") || "[]"));
let recent = JSON.parse(localStorage.getItem("ven-recent") || "[]").filter(n => DATA.some(d => d.name === n));
let current = null;

const $ = id => document.getElementById(id);
const hue = it => HUES[it.cat] ?? 220;
const monoStyle = it =>
  `background:linear-gradient(135deg,hsl(${hue(it)} 80% 68%),hsl(${(hue(it)+45)%360} 85% 55%))`;
const initials = n => n.split(/\s+/).map(w=>w[0]).join("").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase();

function saveFavs(){ localStorage.setItem("ven-favs", JSON.stringify([...favs])); }
function trackRecent(name){
  recent = recent.filter(n => n !== name);
  recent.unshift(name);
  recent = recent.slice(0, 8);
  localStorage.setItem("ven-recent", JSON.stringify(recent));
}

/* ---------- sidebar ---------- */
function renderNav(){
  const nav = $("nav");
  nav.querySelectorAll(".nav-btn").forEach(b=>b.remove());
  for(const key of Object.keys(CATS)){
    const count = key==="favs" ? favs.size : key==="recent" ? recent.length : DATA.filter(d=>d.cat===key).length;
    if(META_CATS.includes(key) && count===0 && state.cat!==key) continue;
    const b = document.createElement("button");
    b.className = "nav-btn" + (state.cat===key ? " active" : "");
    b.innerHTML = `<span class="ic">${CATS[key].ic}</span>${CATS[key].label}<span class="n">${count}</span>`;
    b.onclick = () => { state.cat = key; state.q=""; $("q").value=""; render(); };
    nav.appendChild(b);
  }
  $("foot-counts").textContent =
    `${Object.keys(CATS).length - META_CATS.length} categories · ${DATA.length} platforms`;
}

/* ---------- grid ---------- */
function visibleItems(){
  const q = state.q.trim().toLowerCase();
  let items;
  if(q){
    items = DATA.filter(d =>
      (d.name+" "+d.tag+" "+d.best+" "+d.pro+" "+CATS[d.cat].label).toLowerCase().includes(q));
  } else if(state.cat==="favs"){
    items = DATA.filter(d=>favs.has(d.name));
  } else if(state.cat==="recent"){
    items = recent.map(n=>DATA.find(d=>d.name===n)).filter(Boolean);
  } else {
    items = DATA.filter(d=>d.cat===state.cat);
  }
  return state.sort==="az" ? [...items].sort((a,b)=>a.name.localeCompare(b.name)) : items;
}

function renderGrid(){
  const items = visibleItems();
  const q = state.q.trim();
  $("cat-title").innerHTML = q
    ? `⌕ Search: “${q.replace(/</g,"&lt;")}”`
    : `${CATS[state.cat].ic} ${CATS[state.cat].label}`;
  $("cat-blurb").textContent = q ? `${items.length} match${items.length===1?"":"es"} across all categories.` : CATS[state.cat].blurb;

  const grid = $("grid");
  grid.innerHTML = "";
  $("empty").hidden = items.length>0;

  for(const it of items){
    const t = document.createElement("div");
    t.className = "tile";
    t.tabIndex = 0;
    t.setAttribute("role","button");
    t.innerHTML = `
      <div class="row1">
        <div class="mono" style="${monoStyle(it)}">${initials(it.name)}</div>
        <div class="nm"><b>${it.name}</b><small>${CATS[it.cat].label}</small></div>
        <button class="fav ${favs.has(it.name)?"on":""}" title="Favorite">${favs.has(it.name)?"★":"☆"}</button>
      </div>
      <p class="best">${it.best}</p>
      <div class="foot"><span class="pill">${it.tag}</span><span class="go">Preview →</span></div>`;
    t.onclick = e => { if(e.target.closest(".fav")) return; openPreview(it); };
    t.onkeydown = e => { if(e.key==="Enter") openPreview(it); };
    t.querySelector(".fav").onclick = () => { toggleFav(it.name); };
    grid.appendChild(t);
  }
}

function toggleFav(name){
  favs.has(name) ? favs.delete(name) : favs.add(name);
  saveFavs(); render();
  if(current && current.name===name) syncPvFav();
}

function render(){ renderNav(); renderGrid(); }

/* ---------- preview ---------- */
function openPreview(it){
  current = it;
  $("pv-mono").style = monoStyle(it);
  $("pv-mono").textContent = initials(it.name);
  $("pv-name").textContent = it.name;
  $("pv-tag").textContent = `${CATS[it.cat].label} · ${it.tag}`;
  $("pv-best").textContent = it.best;
  $("pv-pro").textContent = it.pro;
  $("pv-url").textContent = it.url;
  $("pv-open").href = it.url;
  $("pv-frame").src = it.url;
  syncPvFav();
  trackRecent(it.name);
  renderNav();
  $("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function syncPvFav(){
  const on = current && favs.has(current.name);
  $("pv-fav").textContent = on ? "★ Favorited" : "☆ Favorite";
}
function closePreview(){
  $("overlay").classList.remove("open");
  $("pv-frame").src = "about:blank";
  document.body.style.overflow = "";
  current = null;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  let el = $("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  localStorage.setItem("ven-theme", t);
  $("themeBtn").textContent = t === "light" ? "🌙" : "☀️";
}
applyTheme(localStorage.getItem("ven-theme") || "dark");
$("themeBtn").onclick = () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
};

/* ---------- sort ---------- */
$("sortBtn").onclick = () => {
  state.sort = state.sort === "default" ? "az" : "default";
  $("sortBtn").textContent = state.sort === "az" ? "↕ Default order" : "↕ Sort A–Z";
  renderGrid();
};

/* ---------- export / import favorites ---------- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify([...favs], null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "ven-favorites.json";
  a.click();
  URL.revokeObjectURL(url);
  toast("Favorites exported");
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const arr = JSON.parse(reader.result);
      if(!Array.isArray(arr)) throw new Error("bad format");
      const valid = new Set(DATA.map(d=>d.name));
      let added = 0;
      arr.forEach(n => { if(valid.has(n) && !favs.has(n)){ favs.add(n); added++; } });
      saveFavs(); render();
      toast(`Imported ${added} favorite${added===1?"":"s"}`);
    }catch(err){
      toast("Couldn't read that favorites file");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

$("pv-close").onclick = closePreview;
$("pv-fav").onclick = () => current && toggleFav(current.name);
$("pv-copy").onclick = () => {
  if(!current) return;
  navigator.clipboard.writeText(current.url)
    .then(() => toast("Link copied"))
    .catch(() => toast("Couldn't copy link"));
};
$("overlay").addEventListener("click", e => { if(e.target === $("overlay")) closePreview(); });

/* ---------- search + shortcuts ---------- */
$("q").placeholder = `Search ${DATA.length} platforms…`;
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closePreview();
  if(e.key === "/" && document.activeElement !== $("q")){ e.preventDefault(); $("q").focus(); }
  if(["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"].includes(e.key)){
    const active = document.activeElement;
    if(!active || !active.classList.contains("tile")) return;
    const tiles = [...document.querySelectorAll("#grid .tile")];
    const idx = tiles.indexOf(active);
    if(idx === -1) return;
    e.preventDefault();
    let cols = tiles.length;
    if(tiles.length > 1){
      const top0 = tiles[0].offsetTop;
      const diffIdx = tiles.findIndex(t => t.offsetTop !== top0);
      if(diffIdx > 0) cols = diffIdx;
    }
    let next = idx;
    if(e.key === "ArrowRight") next = idx + 1;
    else if(e.key === "ArrowLeft") next = idx - 1;
    else if(e.key === "ArrowDown") next = idx + cols;
    else if(e.key === "ArrowUp") next = idx - cols;
    if(tiles[next]) tiles[next].focus();
  }
});

/* ---------- surprise ---------- */
$("surprise").onclick = () => {
  const pool = visibleItems().length ? visibleItems() : DATA;
  openPreview(pool[Math.floor(Math.random()*pool.length)]);
};

render();
</script>
